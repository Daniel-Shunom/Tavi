name: Desktop installers
# Native builds only: the bundled Node runtime must match the app architecture.
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths:
      - 'desktop/**'
      - 'server/**'
      - 'shared/**'
      - 'src/**'
      - 'public/**'
      - 'assets/**'
      - 'tests/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'tsconfig*.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/desktop-installers.yml'
      - '.github/workflows/windows-installer.yml'
permissions:
  contents: read
concurrency:
  group: desktop-installers-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --maxWorkers=4 --testTimeout=15000
      - run: python tools/skills.py
  installer:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            runner: windows-latest
          - name: linux-x64
            runner: ubuntu-22.04
          - name: macos-intel
            runner: macos-15-intel
          - name: macos-apple-silicon
            runner: macos-15
    env:
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          shared-key: ${{ matrix.name }}
          cache-on-failure: true
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2 file
      - run: npm ci
      - run: npm ci
        working-directory: desktop
      - name: Packaging tests and platform icons
        working-directory: desktop
        run: |
          npm run test:packaging
          npm run prepare:icons
      - name: Rust lint and tests
        working-directory: desktop/src-tauri
        shell: bash
        run: |
          mkdir -p ../resources/service/dist
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - name: Build native installers
        working-directory: desktop
        run: npm run release
      - name: Verify bundled runtime and service
        working-directory: desktop
        run: npm run verify:service
      - name: Verify installed Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: desktop
        run: |
          $installer = Get-ChildItem release-assets/*-setup.exe | Select-Object -First 1
          $installPath = Join-Path $env:RUNNER_TEMP 'tavi-installer-smoke'
          $process = Start-Process -FilePath $installer.FullName -ArgumentList "/S /D=$installPath" -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          node scripts/verify-service.mjs "$installPath/resources"
          if ($LASTEXITCODE -ne 0) { throw 'Installed service smoke check failed' }
      - name: Verify macOS app resources
        if: runner.os == 'macOS'
        working-directory: desktop
        run: node scripts/verify-service.mjs "src-tauri/target/release/bundle/macos/Tavi Studio.app/Contents/Resources/resources"
      - name: Verify extracted Linux packages
        if: runner.os == 'Linux'
        working-directory: desktop
        shell: bash
        run: |
          deb=$(find release-assets -maxdepth 1 -name '*.deb' -print -quit)
          dpkg-deb --extract "$deb" "$RUNNER_TEMP/tavi-deb"
          runtime=$(find "$RUNNER_TEMP/tavi-deb" -type f -path '*/resources/runtime/node' -print -quit)
          test -n "$runtime"
          node scripts/verify-service.mjs "$(dirname "$(dirname "$runtime")")"
          image=$(realpath "$(find release-assets -maxdepth 1 -name '*.AppImage' -print -quit)")
          mkdir -p "$RUNNER_TEMP/tavi-appimage"
          (cd "$RUNNER_TEMP/tavi-appimage" && "$image" --appimage-extract >/dev/null)
          runtime=$(find "$RUNNER_TEMP/tavi-appimage" -type f -path '*/resources/runtime/node' -print -quit)
          test -n "$runtime"
          node scripts/verify-service.mjs "$(dirname "$(dirname "$runtime")")"
      - uses: actions/upload-artifact@v4
        with:
          name: tavi-studio-${{ matrix.name }}
          path: desktop/release-assets/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [validate, installer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: tavi-studio-*
          merge-multiple: true
          path: release-assets
      - name: Publish tagged release after every platform passes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          flags=()
          version="${GITHUB_REF_NAME%%+*}"
          if [[ "${version}" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "${GITHUB_REF_NAME}" release-assets/* --verify-tag --generate-notes --title "Tavi Studio ${GITHUB_REF_NAME}" "${flags[@]}"
