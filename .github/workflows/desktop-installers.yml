name: Desktop installers
# Native builds only: the bundled Node runtime must match the app architecture.
on:
  workflow_call:
    inputs:
      validated:
        description: The caller has passed the affected-program checks.
        type: boolean
        default: false
      skip_intel:
        description: Leave the Intel Mac build to the nightly run.
        type: boolean
        default: false
  workflow_dispatch:
  push:
    tags: ['v*']
  # The Intel Mac build is the slow one, so pull requests and pushes to main skip it and it
  # runs here every night instead. Tags and manual runs still build every platform.
  schedule:
    - cron: '17 7 * * *'
permissions:
  contents: read
concurrency:
  # The event is part of the group so a push to main cannot cancel the nightly Intel build.
  group: desktop-installers-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    if: inputs.validated != true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --maxWorkers=4 --testTimeout=15000
      - run: python tools/skills.py
  installer:
    needs: validate
    if: ${{ !cancelled() && (needs.validate.result == 'success' || (inputs.validated && needs.validate.result == 'skipped')) }}
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # Nightly: Intel Mac only. Called with skip_intel: everything else. Otherwise: all four.
        include: >-
          ${{ fromJSON(
            github.event_name == 'schedule'
              && '[{"name":"macos-intel","runner":"macos-15-intel"}]'
            || inputs.skip_intel == true
              && '[{"name":"windows-x64","runner":"windows-latest"},{"name":"linux-x64","runner":"ubuntu-22.04"},{"name":"macos-apple-silicon","runner":"macos-15"}]'
            || '[{"name":"windows-x64","runner":"windows-latest"},{"name":"linux-x64","runner":"ubuntu-22.04"},{"name":"macos-intel","runner":"macos-15-intel"},{"name":"macos-apple-silicon","runner":"macos-15"}]'
          ) }}
    env:
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: desktop/src-tauri
          shared-key: ${{ matrix.name }}
          cache-on-failure: true
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2 file
      - run: npm ci
      - run: npm ci
        working-directory: desktop
      - name: Packaging tests and platform icons
        working-directory: desktop
        run: |
          npm run test:packaging
          npm run prepare:icons
      - name: Rust lint and tests
        working-directory: desktop/src-tauri
        shell: bash
        run: |
          mkdir -p ../resources/service/dist
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - name: Build native installers
        working-directory: desktop
        # Signs the in-app update bundle when the key is available (absent on fork PRs, which
        # then build unsigned; tagged releases refuse to build without it).
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Tavi's shared Desktop OAuth identity is embedded in the service bundle.
          # Account tokens are never build inputs. Fork PRs can build without this identity.
          TAVI_YOUTUBE_CLIENT_ID: ${{ secrets.TAVI_YOUTUBE_CLIENT_ID }}
          TAVI_YOUTUBE_CLIENT_SECRET: ${{ secrets.TAVI_YOUTUBE_CLIENT_SECRET }}
          TAVI_REQUIRE_YOUTUBE: ${{ startsWith(github.ref, 'refs/tags/v') && '1' || '0' }}
        run: npm run release
      - name: Verify bundled runtime and service
        working-directory: desktop
        run: npm run verify:service
      - name: Verify installed Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: desktop
        run: |
          $installer = Get-ChildItem release-assets/*-setup.exe | Select-Object -First 1
          $installPath = Join-Path $env:RUNNER_TEMP 'tavi-installer-smoke'
          $process = Start-Process -FilePath $installer.FullName -ArgumentList "/S /D=$installPath" -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          node scripts/verify-service.mjs "$installPath/resources"
          if ($LASTEXITCODE -ne 0) { throw 'Installed service smoke check failed' }
      - name: Verify macOS app resources
        if: runner.os == 'macOS'
        working-directory: desktop
        run: node scripts/verify-service.mjs "src-tauri/target/release/bundle/macos/Tavi Studio.app/Contents/Resources/resources"
      - name: Verify extracted Linux packages
        if: runner.os == 'Linux'
        working-directory: desktop
        shell: bash
        run: |
          deb=$(find release-assets -maxdepth 1 -name '*.deb' -print -quit)
          dpkg-deb --extract "$deb" "$RUNNER_TEMP/tavi-deb"
          runtime=$(find "$RUNNER_TEMP/tavi-deb" -type f -path '*/resources/runtime/node' -print -quit)
          test -n "$runtime"
          node scripts/verify-service.mjs "$(dirname "$(dirname "$runtime")")"
          image=$(realpath "$(find release-assets -maxdepth 1 -name '*.AppImage' -print -quit)")
          mkdir -p "$RUNNER_TEMP/tavi-appimage"
          (cd "$RUNNER_TEMP/tavi-appimage" && "$image" --appimage-extract >/dev/null)
          runtime=$(find "$RUNNER_TEMP/tavi-appimage" -type f -path '*/resources/runtime/node' -print -quit)
          test -n "$runtime"
          node scripts/verify-service.mjs "$(dirname "$(dirname "$runtime")")"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tavi-studio-${{ matrix.name }}
          path: desktop/release-assets/*
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 1 || 7 }}
          compression-level: 0
  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [validate, installer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: tavi-studio-*
          merge-multiple: true
          path: release-assets
      - name: Build the updater manifest (latest.json) from every platform
        run: node desktop/scripts/updater-manifest.mjs release-assets 4
      - name: Publish tagged release after every platform passes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          flags=()
          version="${GITHUB_REF_NAME%%+*}"
          if [[ "${version}" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "${GITHUB_REF_NAME}" release-assets/* --verify-tag --generate-notes --title "Tavi Studio ${GITHUB_REF_NAME}" "${flags[@]}"
