<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tavi pose lab</title>
    <style>
      :root {
        --bg: #f2f0eb;
        --panel: #ffffff;
        --ink: #1f1b24;
        --muted: #6b6474;
        --line: #ddd8cf;
        --accent: #c2185b;
        --ok: #2e7d32;
        --bad: #c62828;
        --warn: #b26a00;
        font:
          13px/1.4 'DM Sans',
          system-ui,
          sans-serif;
        color: var(--ink);
      }
      body {
        margin: 0;
        background: var(--bg);
        display: grid;
        grid-template-columns: 1fr 340px;
        grid-template-rows: auto 1fr auto;
        height: 100vh;
      }
      header {
        grid-column: 1 / -1;
        display: flex;
        flex-wrap: wrap;
        gap: 8px 14px;
        align-items: center;
        padding: 8px 12px;
        border-bottom: 1px solid var(--line);
        background: var(--panel);
      }
      header h1 {
        font-size: 15px;
        margin: 0 8px 0 0;
      }
      label {
        display: inline-flex;
        gap: 4px;
        align-items: center;
      }
      #stageWrap {
        position: relative;
        overflow: hidden;
        min-height: 0;
      }
      #stage {
        position: absolute;
        left: 0;
        top: 0;
        width: 1280px;
        height: 720px;
        transform-origin: 0 0;
        background: repeating-linear-gradient(45deg, #39414f 0 14px, #343b48 14px 28px);
      }
      #stage.plain {
        background: #e7e9ee;
      }
      .rect {
        position: absolute;
        border: 3px solid rgba(255, 255, 255, 0.85);
        background: rgba(30, 120, 200, 0.25);
        color: #fff;
        font-weight: 600;
        padding: 4px 6px;
        box-sizing: border-box;
      }
      .rect.chat {
        background: rgba(120, 60, 160, 0.3);
      }
      #stage canvas {
        position: absolute;
        left: 0;
        top: 0;
        width: 1280px;
        height: 720px;
      }
      #puppet.silhouette,
      #onion.silhouette {
        filter: brightness(0);
      }
      aside {
        grid-row: 2 / 4;
        grid-column: 2;
        overflow: auto;
        border-left: 1px solid var(--line);
        background: var(--panel);
        padding: 10px;
      }
      aside h2 {
        font-size: 13px;
        margin: 12px 0 4px;
      }
      #timeline {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 6px 12px;
        border-top: 1px solid var(--line);
        background: var(--panel);
      }
      #scrub {
        flex: 1;
      }
      #keys {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }
      #keys button.active {
        background: var(--accent);
        color: #fff;
      }
      .slider {
        display: grid;
        grid-template-columns: 78px 1fr 54px;
        gap: 4px;
        align-items: center;
      }
      .slider input[type='number'] {
        width: 54px;
      }
      #findings li.error {
        color: var(--bad);
      }
      #findings li.warn {
        color: var(--warn);
      }
      #findings li.ok {
        color: var(--ok);
      }
      textarea {
        width: 100%;
        height: 140px;
        font: 11px monospace;
      }
      .muted {
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Pose lab</h1>
      <label
        >Character
        <select id="character"></select
      ></label>
      <label
        >Beat
        <select id="beat"></select
      ></label>
      <label><input type="checkbox" id="onionToggle" checked /> Onion skin</label>
      <label><input type="checkbox" id="silhouetteToggle" /> Silhouette</label>
      <label><input type="checkbox" id="skeletonToggle" checked /> Skeleton</label>
      <label><input type="checkbox" id="loaToggle" checked /> Line of action</label>
      <label><input type="checkbox" id="contactsToggle" checked /> Contacts</label>
      <label><input type="checkbox" id="sceneToggle" checked /> Scene</label>
      <label
        >View
        <select id="view">
          <option value="overlay">Overlay 1280x720</option>
          <option value="large">Large</option>
        </select></label
      >
    </header>
    <div id="stageWrap">
      <div id="stage">
        <div class="rect webcam" id="webcam">Webcam</div>
        <div class="rect chat" id="chat">Chat</div>
        <canvas id="onion"></canvas>
        <canvas id="puppet"></canvas>
        <canvas id="overlay"></canvas>
      </div>
    </div>
    <aside>
      <div id="status" class="muted">Loading…</div>
      <h2>Keys</h2>
      <div id="keys"></div>
      <h2>Pose of the selected key</h2>
      <div id="sliders"></div>
      <label class="muted"
        >Add channel
        <select id="addChannel"></select
      ></label>
      <h2>Rubric checks</h2>
      <ul id="findings"></ul>
      <h2>Export</h2>
      <button type="button" id="export">Export beat JSON</button>
      <textarea id="exported" spellcheck="false"></textarea>
    </aside>
    <div id="timeline">
      <button type="button" id="play">Play</button>
      <input type="range" id="scrub" min="0" max="1000" value="0" />
      <span id="time">0.00 s</span>
      <label
        >Speed
        <select id="speed">
          <option>0.25</option>
          <option>0.5</option>
          <option selected>1</option>
        </select></label
      >
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
