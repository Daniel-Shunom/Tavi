<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tavi motion lab</title>
    <style>
      :root {
        --ink: #1d1a2b;
        --paper: #eef1f5;
        --stage: #c9d3de;
        --accent: #3b6df0;
        color-scheme: light;
      }
      body {
        margin: 0;
        font:
          14px/1.45 system-ui,
          sans-serif;
        color: var(--ink);
        background: var(--paper);
      }
      header,
      .controls {
        padding: 12px 16px;
        display: flex;
        flex-wrap: wrap;
        gap: 8px 16px;
        align-items: center;
      }
      h1 {
        font-size: 18px;
        margin: 0 12px 0 0;
      }
      .stages {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        padding: 0 16px;
      }
      @media (max-width: 900px) {
        .stages {
          grid-template-columns: 1fr;
        }
      }
      figure {
        margin: 0;
      }
      figcaption {
        font-weight: 600;
        padding: 4px 0;
      }
      .stage {
        position: relative;
        aspect-ratio: 16 / 9;
        background: var(--stage);
        border-radius: 6px;
        overflow: hidden;
        cursor: crosshair;
      }
      .stage canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      button {
        font: inherit;
        padding: 6px 10px;
        border: 1px solid #9aa6b5;
        border-radius: 4px;
        background: white;
        cursor: pointer;
      }
      button:focus-visible,
      select:focus-visible,
      input:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      #status {
        font-family: ui-monospace, monospace;
        font-size: 12px;
        padding: 6px 16px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Tavi motion lab</h1>
      <span
        >Left: previous renderer behaviour (frozen clip frames, sine breath, glide). Right: motion
        layer. Click a stage to walk there.</span
      >
    </header>
    <div class="controls" id="controls"></div>
    <div class="stages">
      <figure>
        <figcaption>Before</figcaption>
        <div class="stage" id="before"><canvas></canvas></div>
      </figure>
      <figure>
        <figcaption>After</figcaption>
        <div class="stage" id="after"><canvas></canvas></div>
      </figure>
    </div>
    <div id="status" role="status"></div>
    <script type="module" src="/src/renderer/motion/lab/main.ts"></script>
  </body>
</html>
