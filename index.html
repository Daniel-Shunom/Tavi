<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#11101a" />
    <title>Tavi — A little life in the corner</title>
    <meta
      name="description"
      content="A familiar face in the corner of your stream. Meet Tavi, your expressive stream companion."
    />
    <style>
      /* The built page carries the landing pre-rendered; other paths never show it. */
      html:not(.landing-mode) #root > .tavi-site,
      html.download-mode #root > .tavi-site:not(.download-page) {
        display: none;
      }
    </style>
    <script>
      // The landing page is white from the first paint (not the studio's dark canvas until the
      // app script runs), and its hero's TV and table are fetched with the page.
      if (location.pathname === '/download')
        document.documentElement.classList.add('download-mode');
      if (
        !['/overlay', '/studio', '/judge', '/avatar-lab', '/dock', '/rig-lab'].includes(
          location.pathname,
        )
      ) {
        document.documentElement.classList.add('landing-mode');
        for (const name of location.pathname === '/download' ? [] : ['table', 'tv']) {
          const link = document.createElement('link');
          link.rel = 'preload';
          link.as = 'image';
          link.fetchPriority = 'high';
          link.imageSrcset = `/media/crt/${name}-900.webp 900w, /media/crt/${name}-1800.webp 1800w`;
          link.imageSizes = '(max-width: 900px) 100vw, 900px';
          document.head.append(link);
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
